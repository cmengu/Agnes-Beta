<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" width="1140" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">AgnesOps run order</title><desc id="d">Coordinator, Research, Writer, Critic, Output in one line. The Critic sends the draft back to the Writer up to twice, and back to Research once when confidence is low. A blocked goal or spent budget goes straight to Output.</desc>
<path d="M40 150H1100" stroke="#8c959f" stroke-width="2" fill="none"/><path d="M1092 144L1102 150L1092 156Z" fill="#8c959f"/>
<path d="M730 142V50Q730 38 718 38H282Q270 38 270 50V138" stroke="#8c959f" stroke-width="1.5" fill="none"/><path d="M264 132L270 142L276 132Z" fill="#8c959f"/>
<text x="500" y="26" text-anchor="middle" font-size="14" fill="#59636e">once, if research confidence is below 0.5 and no revision yet</text>
<path d="M712 142V104Q712 92 700 92H530Q518 92 518 104V138" stroke="#0969da" stroke-width="4" fill="none"/><path d="M510 130L518 142L526 130Z" fill="#0969da"/>
<text x="615" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da">weakest score below 0.75: revise, at most 2 times</text>
<circle cx="40" cy="150" r="6" fill="#8c959f"/>
<text x="54" y="180" font-size="17" font-weight="600" fill="#1f2328">Coordinator</text>
<text x="54" y="202" font-size="14" fill="#59636e">Checks the goal against</text>
<text x="54" y="221" font-size="14" fill="#59636e">constitution.md, then reuses a</text>
<text x="54" y="240" font-size="14" fill="#59636e">saved skill or splits it into</text>
<text x="54" y="259" font-size="14" fill="#59636e">2 to 4 sub-tasks</text>
<circle cx="270" cy="150" r="6" fill="#8c959f"/>
<text x="284" y="180" font-size="17" font-weight="600" fill="#1f2328">Research</text>
<text x="284" y="202" font-size="14" fill="#59636e">Searches and fetches the</text>
<text x="284" y="221" font-size="14" fill="#59636e">sub-tasks in parallel;</text>
<text x="284" y="240" font-size="14" fill="#59636e">confidence from clean pages</text>
<text x="284" y="259" font-size="14" fill="#59636e">and distinct domains</text>
<circle cx="500" cy="150" r="6" fill="#8c959f"/>
<text x="514" y="180" font-size="17" font-weight="600" fill="#1f2328">Writer</text>
<text x="514" y="202" font-size="14" fill="#59636e">Writes the cited report</text>
<text x="514" y="221" font-size="14" fill="#59636e">with [n] markers and a</text>
<text x="514" y="240" font-size="14" fill="#59636e">References list</text>
<circle cx="730" cy="150" r="6" fill="#8c959f"/>
<text x="744" y="180" font-size="17" font-weight="600" fill="#1f2328">Critic</text>
<text x="744" y="202" font-size="14" fill="#59636e">Steelman against critique,</text>
<text x="744" y="221" font-size="14" fill="#59636e">then scores completeness,</text>
<text x="744" y="240" font-size="14" fill="#59636e">clarity, actionability</text>
<circle cx="960" cy="150" r="6" fill="#8c959f"/>
<text x="974" y="180" font-size="17" font-weight="600" fill="#1f2328">Output</text>
<text x="974" y="202" font-size="14" fill="#59636e">Adds the quality line</text>
<text x="974" y="221" font-size="14" fill="#59636e">and run footer, saves</text>
<text x="974" y="240" font-size="14" fill="#59636e">the run to JSON</text>
<path d="M40 156V288Q40 300 52 300H948Q960 300 960 288V164" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
<path d="M953 172L960 162L967 172Z" fill="#8c959f"/>
<text x="500" y="322" text-anchor="middle" font-size="14" fill="#59636e">Goal blocked, or the 14-step / 150 s budget spent at Coordinator, Writer or Critic: straight to Output</text>
</svg>